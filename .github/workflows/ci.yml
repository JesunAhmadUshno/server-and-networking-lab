name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: layout check
        run: python tests/test_smoke.py
      - name: unit and mutation tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: baseline check on the current live capture
        run: python src/run_check.py experiments/snapshots/r610-snapshot-2026-11-08-live.json
      - name: results reproduced from the evidence
        run: python src/make_results.py --check
